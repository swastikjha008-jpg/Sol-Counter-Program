[package]
name = "sol-counter-program"
version = "0.1.0"
edition = "2021"
description = "A simple Solana counter program: increment or decrement a counter stored in any program-owned account"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "1.18.26"
borsh = "0.10.3"

[dev-dependencies]
solana-program-test = "1.18.26"
solana-sdk = "1.18.26"
tokio = { version = "1", features = ["macros"] }
